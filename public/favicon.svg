<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e6c8"/>
      <stop offset="50%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#d000ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Full dark square background with zero border margins so circle mask cuts seamlessly -->
  <rect width="512" height="512" fill="#060912"/>
  <!-- Subtle radial ambient glow -->
  <circle cx="256" cy="256" r="140" fill="#00e6c8" opacity="0.18" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="100" fill="#d000ff" opacity="0.12" filter="url(#glow)"/>

  <!-- Upper wave arc -->
  <path d="M 120 240 C 180 180, 332 180, 392 240" fill="none" stroke="url(#waveGrad)" stroke-width="24" stroke-linecap="round"/>
  <!-- Lower wave arc -->
  <path d="M 86 300 C 160 215, 352 215, 426 300" fill="none" stroke="url(#waveGrad)" stroke-width="38" stroke-linecap="round" filter="url(#glow)"/>
</svg>
